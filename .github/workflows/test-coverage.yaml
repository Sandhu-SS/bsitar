# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    # some issues occured on ubuntu-latest related to pandoc-citeproc
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: n1hility/cancel-previous-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # As cmdstanr is not yet on CRAN, configure the action to only install the
      # 'Depends' packages by default and then manually specify the 'Suggests'
      # packages that are needed for R CMD CHECK
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            R.rsp
            rcmdcheck
            rmarkdown
            lme4
            mice
            BH
            MCMCglmm
            ape
            stan-dev/cmdstanr
            RcppEigen
            emmeans
            projpred
            priorsense
            RWiener
            rtdists
            extraDistr
            spdep
            mnormt
            splines2
            arm
            statmod
            diffobj
            betareg
            usethis
            testthat
            covr
            dtplyr
            doParallel
            jtools
            fastplyr
            doFuture
            cheapr
            installr
            patchwork
            pracma
            bookdown
            kableExtra
            spelling
            Hmisc
            tidybayes
            openxlsx2,
            distributional,
            flexlsx,
            flextable,
            ggdist,
            modelsummary,
            performance,
            projpred,
            sitar





      # Some issues with processx package, so install it
      - name: Install dependencies
        run: |
          install.packages(c("remotes", "processx"))
          remotes::install_deps(dependencies = TRUE)
          install.packages("pak", dependencies = TRUE)
        shell: Rscript {0}
      

      # Some issues rstan - windows latest Error in inDL(x, as.logical(local), as.logical(now)
      - name: Install rstan from source
        if: runner.os == 'Windows'
        run: |
          install.packages('StanHeaders', repos = c('https://stan-dev.r-universe.dev', 'https://cloud.r-project.org'))
          install.packages('rstan', repos = c('https://stan-dev.r-universe.dev', 'https://cloud.r-project.org'))
        shell: Rscript {0}


      # Some issues knitr - macos latest
      - name: Install knitr from source
        # if: runner.os == 'Windows'
        run: |
          install.packages("knitr", type = 'source', dependencies = TRUE)
        shell: Rscript {0}


      # Some issues marginaleffects
      - name: Install marginaleffects from source
        # if: runner.os == 'Windows'
        run: |
          pak::pkg_install("marginaleffects", upgrade = TRUE, dependencies = TRUE)
        shell: Rscript {0}



      # Build Cmdstan
      - name: Build Cmdstan
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = parallel::detectCores())
        shell: Rscript {0}

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
